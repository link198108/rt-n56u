name: 7620CI

# 触发方式：保留原来的push/PR，同时给workflow_dispatch加上选择项
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_group:
        description: '请选择要编译的设备组'
        required: true
        default: 'mt7620'
        options:
          - mt7620
          - mt7628
          - mt7621
          - mt7621-usb
      debug_enabled:
        description: '是否开启tmate调试（一般选no）'
        required: false
        default: 'no'
  release:
    types: [published]

jobs:
  build:
    name: build
    runs-on: ubuntu-20.04
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
    env:
      images_dir: /opt/images
      # 用一个变量存当前选中的组，方便后续用
      selected_group: ${{ github.event.inputs.build_group }}
    steps:
      - uses: actions/checkout@v2

      # 【关键步骤】根据你选的组，赋值对应的设备列表
      - name: 赋值当前要编译的设备列表
        run: |
          case ${{ github.event.inputs.build_group }} in
            mt7620)
              echo "targets=PSG1208 PSG1218 NEWIFI-MINI MI-MINI MI-3 OYE-001 5K-W20" >> $GITHUB_ENV
              ;;
            mt7628)
              echo "targets=HC5861B MI-NANO MZ-R13 MZ-R13P 360P2 HC5761A HC5661A" >> $GITHUB_ENV
              ;;
            mt7621)
              echo "targets=K2P_nano K2P DIR-878 RM2100 CR660x" >> $GITHUB_ENV
              ;;
            mt7621-usb)
              echo "targets=XY-C1 JCG-836PRO JCG-AC860M JCG-Y2 DIR-882 A3004NS MSG1500 WR1200JS MI-R3G NEWIFI3 B70" >> $GITHUB_ENV
              ;;
          esac

      - name: Prepare environment
        run: |
          sudo apt update
          sudo apt install libtool-bin gperf python3-docutils autopoint gettext

      - name: Run shellcheck
        run: sh ./trunk/tools/shellcheck.sh

      - name: Prepare toolchain
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'yes' }}
        with:
          limit-access-to-actor: true

      - name: Start build
        run: |
          cd trunk
          mkdir -p ${images_dir}
          for m in ${{ env.targets }}; do
            echo "正在编译: $m"
            fakeroot ./build_firmware_ci $m
            if [ $? = 0 ]; then
              cp -f images/*.trx ${images_dir}/$m.trx
            else
              echo "编译 $m 失败，终止任务"
              exit 1
            fi
            ./clear_tree_simple >/dev/null 2>&1
          done

      - name: Create archive
        if: ${{ github.event_name != 'release' && success() }}
        run: |
          ls -lh ${images_dir}
          GIT_VERSION=`git rev-parse --short=7 HEAD 2>/dev/null` && [ -n "$GIT_VERSION" ] && \
          image_name=images_${{ env.selected_group }}_${GIT_VERSION} || image_name=images_${{ env.selected_group }}
          cd ${images_dir}; md5sum *.trx |tee md5sum.txt; 7z a -mx=9 ${image_name}.7z ./*
          echo "image_name=${image_name}" >> $GITHUB_ENV

      - name: Upload images to Artifact
        if: ${{ github.event_name != 'release' && success() }}
        uses: actions/upload-artifact@v2.2.1
        with:
          name: ${{ env.image_name }}
          path: ${{ env.images_dir }}/*.7z

      - name: Upload images to Releases
        if: ${{ github.event_name == 'release' && success() }}
        uses: svenstaro/upload-release-action@2.2.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.images_dir }}/*.trx
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
