name: 7620CI

# Controls when the action will run.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      select_build:
        description: '选择单独编译其中一套'
        required: true
        default: 'mt7620'
        options:
          - mt7620
          - mt7628
          - mt7621
          - mt7621-usb
      debug_enabled:
        description: 'Run the build with tmate debugging enabled'
        required: false
        default: 'no'
  release:
    types: [published]

jobs:
  build:
    name: build
    runs-on: ubuntu-20.04
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
    env:
      images_dir: /opt/images
    # 不用矩阵并行，手动赋值当前选中的一套
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v2

      # 根据下拉选择 赋值对应设备列表
      - name: Set target list
        run: |
          case ${{ github.event.inputs.select_build }} in
            mt7620) echo "TARGETS=PSG1208 PSG1218 NEWIFI-MINI MI-MINI MI-3 OYE-001 5K-W20" >> $GITHUB_ENV ;;
            mt7628) echo "TARGETS=HC5861B MI-NANO MZ-R13 MZ-R13P 360P2 HC5761A HC5661A" >> $GITHUB_ENV ;;
            mt7621) echo "TARGETS=K2P_nano K2P DIR-878 RM2100 CR660x" >> $GITHUB_ENV ;;
            mt7621-usb) echo "TARGETS=XY-C1 JCG-836PRO JCG-AC860M JCG-Y2 DIR-882 A3004NS MSG1500 WR1200JS MI-R3G NEWIFI3 B70" >> $GITHUB_ENV ;;
          esac

      - name: Prepare environment
        run: |
          sudo apt update
          sudo apt install libtool-bin gperf python3-docutils autopoint gettext

      - name: Run shellcheck
        run: sh ./trunk/tools/shellcheck.sh

      - name: Prepare toolchain
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'yes' }}
        with:
          limit-access-to-actor: true

      - name: Start build
        run: |
          cd trunk
          mkdir -p ${images_dir}
          for m in ${{ env.TARGETS }}; do
            echo "正在编译机型: $m"
            fakeroot ./build_firmware_ci $m
            if [ $? = 0 ]; then
              cp -f images/*.trx ${images_dir}/$m.trx
            else
              echo "编译 $m 失败，退出"
              exit 1
            fi
            ./clear_tree_simple >/dev/null 2>&1
          done

      - name: Create archive
        if: ${{ github.event_name != 'release' && success() }}
        run: |
          ls -lh ${images_dir}
          GIT_VERSION=`git rev-parse --short=7 HEAD 2>/dev/null` && [ -n "$GIT_VERSION" ] && \
          image_name=images_${{ github.event.inputs.select_build }}_${GIT_VERSION} || image_name=images_${{ github.event.inputs.select_build }}
          cd ${images_dir}; md5sum *.trx |tee md5sum.txt; 7z a -mx=9 ${image_name}.7z ./*
          echo "image_name=${image_name}" >> $GITHUB_ENV

      - name: Upload images to Artifact
        if: ${{ github.event_name != 'release' && success() }}
        uses: actions/upload-artifact@v2.2.1
        with:
          name: ${{ env.image_name }}
          path: ${{ env.images_dir }}/*.7z

      - name: Upload images to Releases
        if: ${{ github.event_name == 'release' && success() }}
        uses: svenstaro/upload-release-action@2.2.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.images_dir }}/*.trx
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
