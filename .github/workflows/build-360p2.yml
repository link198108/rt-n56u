name: Build 360P2 Padavan (Official Config Tool)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取原作者源码（含完整子模块）
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/hanwckf/rt-n56u.git .

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev zlib1g-dev gawk git ccache gettext libssl-dev xsltproc libxml-parser-perl unzip

      - name: 配置并编译360P2固件（使用官方配置生成器）
        run: |
          cd trunk
          make clean
          ./boards/360P2/build.sh config
          make -j$(nproc)

      - name: 上传编译好的固件
        uses: actions/upload-artifact@v4
        with:
          name: 360P2-Padavan-Firmware
          path: trunk/images/*.trx
