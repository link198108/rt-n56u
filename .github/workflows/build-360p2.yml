name: Build 360P2 Padavan (Last Resort)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 直接从原作者仓库拉取完整源码（含子模块）
      - name: 拉取完整源码
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/hanwckf/rt-n56u.git .

      # 2. 安装所有依赖（确保编译环境完整）
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev zlib1g-dev gawk git ccache gettext libssl-dev xsltproc libxml-parser-perl unzip

      # 3. 手动强制生成.config文件，绕开所有路径/脚本问题
      - name: 强制生成配置并编译
        run: |
          cd trunk
          make clean
          # 1. 创建空的.config文件，解决"No such file"错误
          touch .config
          # 2. 写入360P2的核心平台配置
          echo "CONFIG_TARGET_ramips=y" >> .config
          echo "CONFIG_TARGET_mt7620=y" >> .config
          echo "CONFIG_TARGET_360P2=y" >> .config
          # 3. 让系统自动补全所有依赖配置，生成完整.config
          make olddefconfig
          # 4. 开始编译
          make -j$(nproc)

      # 4. 上传编译好的固件
      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: 360P2-Padavan-Firmware
          path: trunk/images/*.trx
